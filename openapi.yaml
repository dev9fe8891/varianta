openapi: 3.0.3
info:
  title: Varianta E-commerce API
  version: 1.0.0
  description: |
    REST API for a generic e-commerce application.
    Authentication uses a JWT stored in an HTTP-only access_token cookie.
servers:
  - url: /
    description: Current server origin
tags:
  - name: Health
    description: API availability and health checks.
  - name: Authentication
    description: User registration, login, logout, and current-user information.
  - name: Categories
    description: Public category listing and Admin category management.
  - name: Products
    description: Product retrieval, filtering, sorting, pagination, and Admin management.
  - name: Product Options
    description: Product option retrieval and Admin management.
  - name: Option Values
    description: Option value retrieval and Admin management.
  - name: Variants
    description: Product variant retrieval and Admin management.
  - name: Variant Option Values
    description: Retrieval and Admin management of option values assigned to variants.
  - name: Orders
    description:
      Authenticated order creation and retrieval, and Admin order-status
      management.
paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Check API health
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: getApiHealth
      security: []
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: User registered and authenticated
          headers:
            Set-Cookie:
              description: Sets the HTTP-only access_token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: postApiAuthRegister
      security: []
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              description: Sets the HTTP-only access_token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: postApiAuthLogin
      security: []
  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out
      description: Clears the authentication cookie.
      responses:
        "204":
          description: Logged out successfully
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: postApiAuthLogout
      security: []
  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: Get the current authenticated user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: getApiAuthMe
  /api/categories:
    get:
      tags:
        - Categories
      summary: List categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: getApiCategories
      security: []
    post:
      tags:
        - Categories
      summary: Create a category
      security:
        - cookieAuth: []
      x-required-role: Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: postApiCategories
  /api/categories/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags:
        - Categories
      summary: Get a category
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: getApiCategoriesId
      security: []
    patch:
      tags:
        - Categories
      summary: Update a category
      security:
        - cookieAuth: []
      x-required-role: Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: patchApiCategoriesId
    delete:
      tags:
        - Categories
      summary: Delete a category
      security:
        - cookieAuth: []
      x-required-role: Admin
      responses:
        "204":
          description: Category deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: deleteApiCategoriesId
  /api/products:
    get:
      tags:
        - Products
      summary: List, filter, sort and paginate products
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
          description: Case-insensitive search in title and description.
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: minPrice
          in: query
          description: Minimum product price. Must be less than or equal to maxPrice when both are provided.
          schema:
            type: integer
            minimum: 0
        - name: maxPrice
          in: query
          description: Maximum product price. Must be greater than or equal to minPrice when both are provided.
          schema:
            type: integer
            minimum: 0
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - title
              - basePrice
              - createdAt
            default: title
        - name: order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 12
      responses:
        "200":
          description: Paginated products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProducts"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: getApiProducts
      security: []
    post:
      tags:
        - Products
      summary: Create a product
      security:
        - cookieAuth: []
      x-required-role: Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: postApiProducts
  /api/products/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags:
        - Products
      summary: Get a product
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: getApiProductsId
      security: []
    patch:
      tags:
        - Products
      summary: Update a product
      security:
        - cookieAuth: []
      x-required-role: Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: patchApiProductsId
    delete:
      tags:
        - Products
      summary: Delete a product
      security:
        - cookieAuth: []
      x-required-role: Admin
      responses:
        "204":
          description: Product deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: deleteApiProductsId
  /api/products/{productId}/options:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      tags:
        - Product Options
      summary: List options for a product
      responses:
        "200":
          description: Product options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductOption"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: getApiProductsProductIdOptions
      security: []
    post:
      tags:
        - Product Options
      summary: Create a product option
      security:
        - cookieAuth: []
      x-required-role: Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductOptionInput"
      responses:
        "201":
          description: Option created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductOption"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: postApiProductsProductIdOptions
  /api/products/{productId}/options/{optionId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
      - $ref: "#/components/parameters/OptionId"
    get:
      tags:
        - Product Options
      summary: Get a product option
      responses:
        "200":
          description: Product option
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductOption"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: getApiProductsProductIdOptionsOptionId
      security: []
    patch:
      tags:
        - Product Options
      summary: Update a product option
      security:
        - cookieAuth: []
      x-required-role: Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductOptionUpdate"
      responses:
        "200":
          description: Updated option
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductOption"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: patchApiProductsProductIdOptionsOptionId
    delete:
      tags:
        - Product Options
      summary: Delete a product option
      security:
        - cookieAuth: []
      x-required-role: Admin
      responses:
        "204":
          description: Option deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: deleteApiProductsProductIdOptionsOptionId
  /api/products/{productId}/options/{optionId}/values:
    parameters:
      - $ref: "#/components/parameters/ProductId"
      - $ref: "#/components/parameters/OptionId"
    get:
      tags:
        - Option Values
      summary: List values for a product option
      responses:
        "200":
          description: Option values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OptionValue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: getApiProductsProductIdOptionsOptionIdValues
      security: []
    post:
      tags:
        - Option Values
      summary: Create an option value
      security:
        - cookieAuth: []
      x-required-role: Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptionValueInput"
      responses:
        "201":
          description: Option value created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptionValue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: postApiProductsProductIdOptionsOptionIdValues
  /api/products/{productId}/options/{optionId}/values/{valueId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
      - $ref: "#/components/parameters/OptionId"
      - $ref: "#/components/parameters/ValueId"
    get:
      tags:
        - Option Values
      summary: Get an option value
      responses:
        "200":
          description: Option value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptionValue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: getApiProductsProductIdOptionsOptionIdValuesValueId
      security: []
    patch:
      tags:
        - Option Values
      summary: Update an option value
      security:
        - cookieAuth: []
      x-required-role: Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptionValueUpdate"
      responses:
        "200":
          description: Updated option value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptionValue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: patchApiProductsProductIdOptionsOptionIdValuesValueId
    delete:
      tags:
        - Option Values
      summary: Delete an option value
      security:
        - cookieAuth: []
      x-required-role: Admin
      responses:
        "204":
          description: Option value deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: deleteApiProductsProductIdOptionsOptionIdValuesValueId
  /api/products/{productId}/variants:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      tags:
        - Variants
      summary: List variants for a product
      responses:
        "200":
          description: Product variants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Variant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: getApiProductsProductIdVariants
      security: []
    post:
      tags:
        - Variants
      summary: Create a product variant
      security:
        - cookieAuth: []
      x-required-role: Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantInput"
      responses:
        "201":
          description: Variant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: postApiProductsProductIdVariants
  /api/products/{productId}/variants/{variantId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
      - $ref: "#/components/parameters/VariantId"
    get:
      tags:
        - Variants
      summary: Get a product variant
      responses:
        "200":
          description: Product variant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: getApiProductsProductIdVariantsVariantId
      security: []
    patch:
      tags:
        - Variants
      summary: Update a product variant
      security:
        - cookieAuth: []
      x-required-role: Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantUpdate"
      responses:
        "200":
          description: Updated variant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: patchApiProductsProductIdVariantsVariantId
    delete:
      tags:
        - Variants
      summary: Delete a product variant
      security:
        - cookieAuth: []
      x-required-role: Admin
      responses:
        "204":
          description: Variant deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: deleteApiProductsProductIdVariantsVariantId
  /api/products/{productId}/variants/{variantId}/option-values:
    parameters:
      - $ref: "#/components/parameters/ProductId"
      - $ref: "#/components/parameters/VariantId"
    get:
      tags:
        - Variant Option Values
      summary: List option values assigned to a variant
      responses:
        "200":
          description: Assigned option values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VariantOptionValue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: getApiProductsProductIdVariantsVariantIdOptionValues
      security: []
    post:
      tags:
        - Variant Option Values
      summary: Assign an option value to a variant
      security:
        - cookieAuth: []
      x-required-role: Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - optionValueId
              properties:
                optionValueId:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Option value assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariantOptionValue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: postApiProductsProductIdVariantsVariantIdOptionValues
  /api/products/{productId}/variants/{variantId}/option-values/{optionValueId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
      - $ref: "#/components/parameters/VariantId"
      - $ref: "#/components/parameters/OptionValueId"
    delete:
      tags:
        - Variant Option Values
      summary: Remove an option value from a variant
      security:
        - cookieAuth: []
      x-required-role: Admin
      responses:
        "204":
          description: Option value assignment removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: deleteApiProductsProductIdVariantsVariantIdOptionValuesOptionValueId
  /api/orders:
    post:
      tags:
        - Orders
      summary: Create an order
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: postApiOrders
    get:
      tags:
        - Orders
      summary: List the authenticated user's orders
      security:
        - cookieAuth: []
      responses:
        "200":
          description: User orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: getApiOrders
  /api/orders/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags:
        - Orders
      summary: Get one of the authenticated user's orders
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: getApiOrdersId
  /api/orders/{id}/status:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags:
        - Orders
      summary: Update an order's status
      description: |
        Admin only. Allowed transitions are PENDING to PAID or CANCELLED,
        and PAID to COMPLETED. Repeating the current status is a no-op.
      security:
        - cookieAuth: []
      x-required-role: Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - PENDING
                    - PAID
                    - CANCELLED
                    - COMPLETED
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Invalid or concurrent status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: patchApiOrdersIdStatus
components:
